{{- define "main" }}
<section class="shell section page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}
  <div class="prose">{{ . }}</div>
  {{- end }}
</section>
{{- if .Pages }}
<section class="shell section">
  <ul class="post-list">
    {{- range .Pages }}
    <li class="post-card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{- with .Params.summary }}
      <p>{{ . }}</p>
      {{- end }}
    </li>
    {{- end }}
  </ul>
</section>
{{- end }}
{{- end }}
