# Real client words, taken verbatim from sanselig.dk/wellness/testemonials.
# Lightly trimmed for length only — no wording invented, no names invented.
# Attribution is exactly as published: initials, first name, or none.
- quote: "Jeg har været fast inventar på briksen hos Lise siden 2011. Startede pga. kraftig stress og en hel del ubalancer i kroppen. Fra første dag kunne jeg mærke, at Lise kunne noget specielt. Hun tager både fat og er fintfølende. Jeg giver min dybeste anbefaling."
  name: "M"
  topic: "Stress"
- quote: "En zoneterapi hos Lise gør mange gode ting. Det giver mig ro i hovedet, og har hjulpet mig af med bl.a. en overbelastet skulder. Hermed min varmeste anbefaling."
  name: "Anders"
  topic: "Bevægeapparatet"
- quote: "1000 tak for behandlingen i mandags. Det var en skøn oplevelse. Kl. 2.30 i nat gik vandet, og kl. 10.21 blev vores vidunderlige søn født. Ord kan ikke beskrive, hvilken fantastisk oplevelse det har været."
  name: ""
  topic: "Fødsel"
- quote: "Tak for hjælpen med vores datter. Efter besøget hos dig har hun været en helt anden baby — sikke en lettelse."
  name: ""
  topic: "Baby"
- quote: "Lise er altid til stede, lytter og kommer med gode observationer. Hun er heller ikke bange for at sige, når et problem ikke dækkes af hendes fag, men sender gerne videre."
  name: ""
  topic: "Graviditet"
- quote: "Efter et par behandlinger er knæskaden nu stærkt på retur, godt arbejde. Det betyder, at mine forberedelser til min Ironman er blevet optimeret."
  name: ""
  topic: "Sportsskade"
- quote: "Lise har en unik evne til at få ens krop til at slappe fuldstændigt af. Det gør, at behandlingen føles intens og giver kroppen den energi og det overskud, som en travl hverdag kræver."
  name: ""
  topic: "Overskud"
- quote: "Tak for i dag — det er altid hyggeligt at komme hos dig frem for en upersonlig klinik. Man føler sig i gode, trygge hænder."
  name: ""
  topic: "Klinikken"
