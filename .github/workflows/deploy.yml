name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Lad kun én udrulning køre ad gangen, og afbryd ikke en igangværende.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # .GitInfo og .Lastmod

      - name: Installér Hugo
        run: |
          curl -sSLf -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - uses: actions/configure-pages@v6
        id: pages

      - name: Byg site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Copenhagen
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
